<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architector - Visual Logic Node Editor</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Comfortaa:wght@400;700&family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            /* PLAN_UI_STYLE_MINI.md — единый визуальный язык: токены, не литералы.
               Ни один компонент не должен задавать цвет/радиус/тень напрямую. */
            --bg: #0f1115;
            --panel: #171a21;
            --panel-2: #1d212b;
            --line: #2b3140;
            --line-2: #3a4256;
            --text: #e3e7ef;
            --muted: #8b95a8;
            --accent: #4f8cff;
            --ok: #3ccf8e;
            --warn: #e0a84a;
            --bad: #ef5d6b;
            --lane-a: rgba(255, 255, 255, .02);
            --lane-b: rgba(255, 255, 255, .06);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --r-win: 8px;
            --r-card: 6px;
            --r-chip: 3px;
            --shadow-win: 0 12px 40px rgba(0, 0, 0, .45);
            --shadow-card: 0 2px 6px rgba(0, 0, 0, .35);

            /* Легаси-алиасы старых имён — снимаются по ходу пп. 2-4 плана, когда
               соответствующие компоненты переходят на токены выше напрямую. */
            --bg-color: var(--bg);
            --panel-bg: var(--panel);
            --grid-color: rgba(255, 255, 255, 0.05);
            --accent-blue: var(--accent);
            --border-color: var(--line);
            --text-main: var(--text);
            --text-muted: var(--muted);
        }
    }

    @layer base {
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }
    }

    @layer components {
        /* PLAN_UI_STYLE_MINI.md §3: единый стиль контейнера (окно/панель/тулбар/
           FAB) — сплошной фон токеном, без размытия (заменяет .glass-panel). */
        .panel {
            background: var(--panel);
            border: 1px solid var(--line-2);
            border-radius: var(--r-win);
            box-shadow: var(--shadow-win);
        }

        .btn {
            @apply px-3 py-1.5 rounded text-sm transition-colors duration-200 flex items-center justify-center gap-2 cursor-pointer;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }
        .btn-primary:hover {
            background: color-mix(in srgb, var(--accent) 85%, black);
        }

        .input-field {
            @apply w-full bg-black/50 border rounded px-3 py-1.5 text-sm focus:outline-none transition-colors;
            border-color: var(--line);
            color: var(--text-main);
        }
        .input-field:focus {
            border-color: var(--accent);
        }
    }
    
    .canvas-grid {
        background-image: 
            linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
            linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
    }

    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
        height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.25);
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.45);
    }
    .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.25) rgba(0, 0, 0, 0.2);
    }
    </style>

    <style>
    @keyframes parent-glow-pulse {
        0%, 100% {
            box-shadow: 0 0 15px color-mix(in srgb, var(--parent-pulse-color, #4f8cff) 20%, transparent) !important;
            border-color: color-mix(in srgb, var(--parent-pulse-color, #4f8cff) 40%, transparent) !important;
        }
        50% {
            box-shadow: 0 0 35px color-mix(in srgb, var(--parent-pulse-color, #4f8cff) 70%, transparent) !important;
            border-color: var(--parent-pulse-color, #4f8cff) !important;
        }
    }
    .animate-parent-pulse {
        animation: parent-glow-pulse 2s infinite ease-in-out !important;
        outline: 2px solid color-mix(in srgb, var(--parent-pulse-color, #4f8cff) 50%, transparent) !important;
        outline-offset: 4px !important;
    }

    /* Кросс-проектная связь (Фаза 6.1): единственный визуальный маркер того,
       что эта связь/прокси уходит за пределы проекта — сама геометрия и
       остальной стиль (цвет, штрих) идентичны обычной межуровневой связи. */
    @keyframes cross-project-link-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
    }
    .cross-project-link-pulse {
        animation: cross-project-link-pulse 1.6s ease-in-out infinite;
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="utils/geometry.js?v=14.1"></script>
    <script type="text/babel" src="utils/hierarchy.js?v=14.1"></script>
    <script type="text/babel" src="store/reducer.js?v=14.1"></script>
    <script type="text/babel" src="store/engine.js?v=10.33"></script>
    <script type="text/babel" src="store/Store.js?v=10.33"></script>
    <!-- v14: Frame.js/Lane.js/LaneWindow.js заменяют бывшие Layer.js/LevelWindow.js
         (Дорожки/Окна/Рамки, см. docs/LANES_MODEL.md) — старые файлы удалены в Фазе 6. -->
    <script type="text/babel" src="components/Frame.js?v=14.1"></script>
    <script type="text/babel" src="components/Link.js?v=14.1"></script>
    <script type="text/babel" src="components/Port.js?v=14.1"></script>
    <script type="text/babel" src="components/NodePreview.js?v=14.1"></script>
    <script type="text/babel" src="components/OutlinerTree.js?v=14.1"></script>
    <script type="text/babel" src="components/AIAgentNodeContent.js?v=14.1"></script>
    <script type="text/babel" src="components/Node.js?v=14.1"></script>
    <script type="text/babel" src="components/Lane.js?v=14.1"></script>
    <script type="text/babel" src="components/LaneWindow.js?v=14.1"></script>
    <script type="text/babel" src="components/Canvas.js?v=14.1"></script>
    <script type="text/babel" src="components/ContextActionBar.js?v=14.1"></script>
    <script type="text/babel" src="components/Toolbar.js?v=14.1"></script>
    <script type="text/babel" src="components/Library.js?v=14.1"></script>
    <script type="text/babel" src="app.js?v=14.1"></script>
</body>
</html>
